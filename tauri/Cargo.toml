[package]
name = "orbit"
version = "0.6.1"
description = "Orbit — Claude agent dashboard"
authors = ["you"]
license = "MIT"
edition = "2021"
default-run = "orbit"
rust-version = "1.85"

# Declare the `feature = "cargo-clippy"` cfg the objc `msg_send!` macro emits,
# so it stops warning as an unexpected cfg on macOS builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# MCP stdio mode: orbit.exe --mcp-stdio (no separate orbit-mcp binary — saves compile + disk)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png", "devtools", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.25"
dirs = "6"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
ignore = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
portable-pty = "0.9"
agent-client-protocol-schema = "0.11"
tauri-plugin-shell = "2.3.5"
interprocess = { version = "2", features = ["tokio"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
hyper = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
